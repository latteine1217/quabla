name: Feature request
description: Propose a new capability or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you would like, with a short usage example if possible.
    validations:
      required: true
  - type: dropdown
    id: backends
    attributes:
      label: Affected backends
      multiple: true
      options:
        - cpu
        - mlx
        - cuda
        - cuda-nccl
        - backend-independent
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

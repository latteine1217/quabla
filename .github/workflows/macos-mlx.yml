# macOS check: the mlx feature build plus the default gates on the newest
# supported Python. A cold mlx build compiles MLX C++ from source through
# mlx-rs and dominates the run time, so this workflow is not run on every push.
# It runs on pull requests that touch the MLX backend, the Cargo manifests or
# lockfile, or this workflow, and on demand (for example before a release).
#
# A second job compiles the mlx feature with the MSRV toolchain, in parallel
# and with its own cache.
#
# MLX is compiled and linted only: hosted macOS runners have no usable Metal
# device, and with the mlx feature cargo test would execute MLX GPU tests.
name: macOS MLX check

on:
  pull_request:
    paths:
      - "crates/quabla-core/src/tensor_ir/mlx*.rs"
      - "crates/**/Cargo.toml"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/macos-mlx.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    name: macos (mlx check + python 3.13)
    runs-on: macos-15
    # A cold run builds MLX C++ through mlx-rs (cmake).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a master commit (the stable branch is not in master's
      # history and may be garbage-collected); the toolchain input then
      # selects stable.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features quabla-core/mlx -- -D warnings
      - run: cargo test --workspace
      # NumPy is optional for quabla, but installed here so the NumPy
      # interop tests (buffer import and export) run instead of skipping.
      # Pinned to a major series so a new release cannot turn the gate red
      # without a code change.
      - name: Build extension
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install 'maturin>=1.14,<2' 'numpy>=2,<3'
          VIRTUAL_ENV="$PWD/.venv-ci" .venv-ci/bin/maturin develop
      - run: tests/python/run_suites.sh .venv-ci/bin/python

  msrv:
    name: macos (mlx check on the MSRV)
    runs-on: macos-15
    # A cold run builds MLX C++ through mlx-rs (cmake).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace manifest is the single source of the MSRV.
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked --features quabla-core/mlx

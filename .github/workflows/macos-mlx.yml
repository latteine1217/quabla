# macOS check: the mlx feature build plus the default gates on the newest
# supported Python. A cold mlx build compiles MLX C++ from source through
# mlx-rs and dominates the run time, so this workflow is not run on every push.
# It runs on pull requests that touch the MLX backend, the Cargo manifests or
# lockfile, or this workflow, and on demand (for example before a release).
#
# MLX is compiled and linted only: hosted macOS runners have no usable Metal
# device, and with the mlx feature cargo test would execute MLX GPU tests.
name: macOS MLX check

on:
  pull_request:
    paths:
      - "crates/quabla-core/src/tensor_ir/mlx*.rs"
      - "crates/**/Cargo.toml"
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/macos-mlx.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    name: macos (mlx check + python 3.13)
    runs-on: macos-15
    # A cold run builds MLX C++ through mlx-rs (cmake).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a master commit (the stable branch is not in master's
      # history and may be garbage-collected); the toolchain input then
      # selects stable.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features quabla-core/mlx -- -D warnings
      - run: cargo test --workspace
      # NumPy is optional for quabla, but installed here so the NumPy
      # interop tests (buffer import and export) run instead of skipping.
      # Pinned to a major series so a new release cannot turn the gate red
      # without a code change.
      - name: Build extension
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install 'maturin>=1.14,<2' 'numpy>=2,<3'
          VIRTUAL_ENV="$PWD/.venv-ci" .venv-ci/bin/maturin develop
      - run: .venv-ci/bin/python tests/python/test_matrix.py
      - run: .venv-ci/bin/python tests/python/test_api.py
      - run: .venv-ci/bin/python tests/python/test_devices_api.py
      - run: .venv-ci/bin/python tests/python/test_lower_program.py
      - run: .venv-ci/bin/python tests/python/test_optim_api.py
      - run: .venv-ci/bin/python tests/python/test_control_api.py
      - run: .venv-ci/bin/python tests/python/test_distributed_api.py
      - run: .venv-ci/bin/python tests/python/test_adam_fused.py
      - run: .venv-ci/bin/python tests/python/test_jacobian_chunks.py
      - run: .venv-ci/bin/python tests/python/test_cholesky_native.py
      - run: .venv-ci/bin/python tests/python/test_buffer_narrow_import.py
      - run: .venv-ci/bin/python tests/python/test_legacy_jacobian_direction.py
      - run: .venv-ci/bin/python tests/python/test_ode_api.py
      - run: .venv-ci/bin/python tests/python/test_random_api.py
      - run: .venv-ci/bin/python tests/python/test_packaging_api.py

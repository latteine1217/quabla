# Development gates. Every step runs the same command a contributor runs
# locally, so a red check reproduces with the command shown in its log.
#
# One Linux job for the gates on purpose: the test suites finish in seconds,
# so the cost is compilation. Sharing one job shares one build cache instead
# of recompiling the workspace per job, also across the Python versions the
# suites run on (3.10 to 3.14, the classifiers in pyproject.toml). The MSRV
# check is a second job because it compiles with another toolchain and
# cannot share that cache.
#
# Deliberately NOT run here:
# - CUDA, NCCL and MLX runtime tests. Hosted runners have no NVIDIA GPU and no
#   usable Metal device; those suites run on the GPU hosts, gated by
#   QUABLA_CUDA_TEST / QUABLA_CUDA_NCCL_TEST / QUABLA_MLX_TEST (unset here).
# - macOS and the MLX build. A cold mlx build compiles MLX C++ from source and
#   dominates the run time; that check lives in macos-mlx.yml and runs only on
#   pull requests that touch the MLX backend or the Cargo manifests, and on
#   demand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless on fresh runners and bloat the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    name: gates (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a master commit (the stable branch is not in master's
      # history and may be garbage-collected); the toolchain input then
      # selects stable.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Oldest supported interpreter (requires-python >= 3.10). PyO3 needs it
      # at build time; setup-python also exports LD_LIBRARY_PATH so the test
      # binaries find libpython.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      # pipx ships with the runner image. Ruff is pinned to a minor series so
      # a new release cannot turn the gate red without a code change.
      - run: pipx run --spec 'ruff>=0.15,<0.16' ruff check tests examples python
      # Type check of the public Python API (pyrightconfig.json: standard
      # mode over python/quabla, reading the extension's `_quabla.pyi`, so no
      # build is needed). Pinned exactly: new pyright releases add checks.
      - run: pipx run --spec 'pyright==1.1.414' pyright
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Compile-only check of the CUDA/NCCL backend, which macOS development
      # machines cannot compile at all. cudarc is built with
      # fallback-dynamic-loading, so no CUDA toolkit is needed.
      - run: cargo clippy --workspace --all-targets --features quabla-core/cuda-nccl -- -D warnings
      - run: cargo test --workspace
      # The Python suites run on every CPython the classifiers list. The
      # extension is not abi3, so each interpreter gets its own build; only
      # quabla-python links pyo3, so a rebuild reuses the compiled
      # quabla-core. The steps above use 3.10, set up first so that it is
      # the default `python` for the Rust builds and tests.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
      # NumPy is optional for quabla, but installed here so the NumPy
      # interop tests (buffer import and export) run instead of skipping.
      # Pinned to a major series so a new release cannot turn the gate red
      # without a code change. Every interpreter runs even after a failure;
      # each failing one is reported as an error annotation.
      - name: Build and test the extension on each Python
        run: |
          status=0
          for version in 3.10 3.11 3.12 3.13 3.14; do
            echo "::group::Python $version"
            venv=".venv-ci-$version"
            "python$version" -m venv "$venv"
            "$venv/bin/python" -m pip install 'maturin>=1.14,<2' 'numpy>=2,<3'
            VIRTUAL_ENV="$PWD/$venv" "$venv/bin/maturin" develop
            tests/python/run_suites.sh "$venv/bin/python" || {
              echo "::error::Python suites failed on Python $version"
              status=1
            }
            echo "::endgroup::"
          done
          exit "$status"

  msrv:
    name: msrv (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace manifest is the single source of the MSRV.
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # PyO3's build script needs an interpreter.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --locked: the committed lockfile is what a source build resolves.
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --workspace --all-targets --locked --features quabla-core/cuda-nccl

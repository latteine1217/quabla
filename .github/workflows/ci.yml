# Development gates. Every step runs the same command a contributor runs
# locally, so a red check reproduces with the command shown in its log.
#
# One Linux job on purpose: the test suites finish in seconds, so the cost is
# compilation. Sharing one job shares one build cache instead of recompiling
# the workspace per job.
#
# Deliberately NOT run here:
# - CUDA, NCCL and MLX runtime tests. Hosted runners have no NVIDIA GPU and no
#   usable Metal device; those suites run on the GPU hosts, gated by
#   QUABLA_CUDA_TEST / QUABLA_CUDA_NCCL_TEST / QUABLA_MLX_TEST (unset here).
# - macOS and the MLX build. A cold mlx build compiles MLX C++ from source and
#   dominates the run time; that check lives in macos-mlx.yml and runs only on
#   pull requests that touch the MLX backend or the Cargo manifests, and on
#   demand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless on fresh runners and bloat the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    name: gates (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a master commit (the stable branch is not in master's
      # history and may be garbage-collected); the toolchain input then
      # selects stable.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Oldest supported interpreter (requires-python >= 3.10). PyO3 needs it
      # at build time; setup-python also exports LD_LIBRARY_PATH so the test
      # binaries find libpython.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # pipx ships with the runner image. Ruff is pinned to a minor series so
      # a new release cannot turn the gate red without a code change.
      - run: pipx run --spec 'ruff>=0.15,<0.16' ruff check tests examples python
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Compile-only check of the CUDA/NCCL backend, which macOS development
      # machines cannot compile at all. cudarc is built with
      # fallback-dynamic-loading, so no CUDA toolkit is needed.
      - run: cargo clippy --workspace --all-targets --features quabla-core/cuda-nccl -- -D warnings
      - run: cargo test --workspace
      # NumPy is optional for quabla, but installed here so the NumPy
      # interop tests (buffer import and export) run instead of skipping.
      # Pinned to a major series so a new release cannot turn the gate red
      # without a code change.
      - name: Build extension
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install 'maturin>=1.14,<2' 'numpy>=2,<3'
          VIRTUAL_ENV="$PWD/.venv-ci" .venv-ci/bin/maturin develop
      # The script's __main__ runner executes every test_*; exit 0 == pass.
      - run: .venv-ci/bin/python tests/python/test_matrix.py
      - run: .venv-ci/bin/python tests/python/test_api.py
      - run: .venv-ci/bin/python tests/python/test_devices_api.py
      - run: .venv-ci/bin/python tests/python/test_lower_program.py
      - run: .venv-ci/bin/python tests/python/test_optim_api.py
      - run: .venv-ci/bin/python tests/python/test_control_api.py
      - run: .venv-ci/bin/python tests/python/test_random_api.py
      - run: .venv-ci/bin/python tests/python/test_distributed_api.py
      - run: .venv-ci/bin/python tests/python/test_adam_fused.py
      - run: .venv-ci/bin/python tests/python/test_jacobian_chunks.py
      - run: .venv-ci/bin/python tests/python/test_cholesky_native.py
      - run: .venv-ci/bin/python tests/python/test_buffer_narrow_import.py
      - run: .venv-ci/bin/python tests/python/test_legacy_jacobian_direction.py
      - run: .venv-ci/bin/python tests/python/test_ode_api.py

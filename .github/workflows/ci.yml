# Development gates. Every step runs the same command a contributor runs
# locally, so a red check reproduces with the command shown in its log.
#
# One Linux job on purpose: the test suites finish in seconds, so the cost is
# compilation. Sharing one job shares one build cache instead of recompiling
# the workspace per job.
#
# Deliberately NOT run here:
# - CUDA, NCCL and MLX runtime tests. Hosted runners have no NVIDIA GPU and no
#   usable Metal device; those suites run on the GPU hosts, gated by
#   NABLA_CUDA_TEST / NABLA_CUDA_NCCL_TEST / NABLA_MLX_TEST (unset here).
# - macOS and the MLX build. macOS minutes are billed at 10x for this private
#   repository and the mlx feature compiles MLX C++ from source; that check
#   lives in macos-mlx.yml and runs on demand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless on fresh runners and bloat the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    name: gates (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Oldest supported interpreter (requires-python >= 3.10). PyO3 needs it
      # at build time; setup-python also exports LD_LIBRARY_PATH so the test
      # binaries find libpython.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # pipx ships with the runner image. Ruff is pinned to a minor series so
      # a new release cannot turn the gate red without a code change.
      - run: pipx run --spec 'ruff>=0.15,<0.16' ruff check tests examples scripts
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Compile-only check of the CUDA/NCCL backend, which macOS development
      # machines cannot compile at all. cudarc is built with
      # fallback-dynamic-loading, so no CUDA toolkit is needed.
      - run: cargo clippy --workspace --all-targets --features nabla-core/cuda-nccl -- -D warnings
      - run: cargo test --workspace
      - name: Build extension
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install 'maturin>=1.14,<2'
          VIRTUAL_ENV="$PWD/.venv-ci" .venv-ci/bin/maturin develop
      # The script's __main__ runner executes every test_*; exit 0 == pass.
      - run: .venv-ci/bin/python tests/python/test_matrix.py

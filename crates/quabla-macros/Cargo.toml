[package]
name = "quabla-macros"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Quabla is released as source only; the crates are not published to crates.io.
publish = false
description = "Restricted source-level forward-mode autodiff macros for Quabla"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

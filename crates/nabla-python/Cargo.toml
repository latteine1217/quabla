[package]
name = "nabla-python"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 Python bindings for the Nabla SciML runtime"

[lib]
name = "nabla"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
extension-module = ["pyo3/extension-module"]
cuda = ["nabla-core/cuda"]
cuda-nccl = ["cuda", "nabla-core/cuda-nccl"]
mlx = ["nabla-core/mlx"]

[dependencies]
pyo3 = "0.29"
nabla-core = { path = "../nabla-core" }

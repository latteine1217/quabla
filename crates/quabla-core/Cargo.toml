[package]
name = "quabla-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Quabla is released as source only; the crates are not published to crates.io.
publish = false
description = "Tensor IR, autodiff transforms, and CPU/CUDA/MLX backends for Quabla"

[lib]
name = "quabla_core"
path = "src/lib.rs"

[features]
cuda = ["dep:cudarc", "dep:libloading"]
# Keep NCCL opt-in: ordinary single-device CUDA builds must neither require nor
# accidentally link a collective runtime.
cuda-nccl = ["cuda", "cudarc/nccl"]
mlx = ["dep:mlx-rs"]
mlx-metal = ["mlx", "mlx-rs/metal", "mlx-rs/accelerate"]

[dependencies]
quabla-macros = { path = "../quabla-macros" }

[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { version = "0.19.8", default-features = false, features = ["driver", "nvrtc", "cublas", "cusolver", "fallback-dynamic-loading", "cuda-13010"], optional = true }
libloading = { version = "0.9.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
mlx-rs = { version = "0.25.3", default-features = false, optional = true }

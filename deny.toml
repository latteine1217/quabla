# cargo-deny configuration: run `cargo deny check` from the repository root.
# CI runs it on every push and pull request and weekly (audit.yml), since a
# new RustSec advisory can fail it without a code change.

[graph]
# The platforms the wheels ship for, with every feature, so the CUDA/NCCL
# (Linux) and MLX (macOS) dependency trees are checked too.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound) and every
# yanked version fails the check; an accepted advisory is listed in
# `ignore` with the reason.
unmaintained = "all"
yanked = "deny"
ignore = [
    # `paste` is unmaintained (archived, no successor release). mlx-rs 0.32
    # depends on it at compile time for the macOS MLX build only, and no
    # mlx-rs release drops it. An unmaintained notice, not a vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained paste via mlx-rs 0.32; no replacement available" },
]

[licenses]
# The licenses the dependency tree uses today, all compatible with the
# project's MIT OR Apache-2.0. A new license fails the check until it is
# reviewed and added here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # bindgen, a build dependency of mlx-sys.
    "BSD-3-Clause",
    # libloading, used by cudarc and by clang-sys (through bindgen).
    "ISC",
]
confidence-threshold = 0.9

[bans]
# Upstream crates pull in two versions of syn, libloading, itertools, and
# shlex, so duplicate versions only warn.
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path and are not published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

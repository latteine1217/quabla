[workspace]
members = ["crates/quabla-core", "crates/quabla-macros", "crates/quabla-python"]
# Resolver 3 prefers dependency versions whose `rust-version` the
# workspace's MSRV satisfies, so `cargo update` cannot raise it silently.
resolver = "3"

[workspace.package]
edition = "2021"
# The minimum supported Rust version: `libloading`, used by the CUDA
# backend, requires 1.88. It is raised only in minor releases.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/latteine1217/quabla"

# Cargo's release default strips debug info with the platform `strip`. On
# macOS 27 (ld-27037) that leaves the extension module with a misaligned
# LINKEDIT string pool, so a source build (`pip install` from the sdist)
# fails to import. Keeping the symbols costs about 150 KB per module.
[profile.release]
strip = false
